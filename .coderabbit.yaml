# CodeRabbit configuration — https://docs.coderabbit.ai/reference/yaml-template
#
# Reviews activate once the CodeRabbit GitHub App is installed on this
# repository (https://github.com/apps/coderabbitai). Until then this file is
# inert. The instructions below encode the same standards CONTRIBUTING.md
# holds humans to, so automated review argues from the repo's own rules
# rather than generic taste.

language: en-US

tone_instructions: >-
  Be direct and specific. This project rejects rules based on taste: every
  lint rule must cite a named style authority or a measured effect size, and
  must not fire on the pre-LLM calibration corpus. Hold review comments to
  the same bar — cite the standard or the measurement, or frame the comment
  as a question.

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  # An AI-tic linter with a poem in its PRs would be a self-report.
  poem: false
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    # Generated from the Kobak et al. dataset; review tools/build_excess_vocab.py
    # instead of the output.
    - "!techlint/data/ai_excess_vocab.json"
    # Committed calibration results; regenerated by benchmarks/run_calibration.py.
    - "!benchmarks/results/**"
    # Context-reviewed exemptions; each entry carries its own written reason.
    - "!.techlint-baseline.jsonl"

  path_instructions:
    - path: "techlint/checks_*.py"
      instructions: >-
        Every rule must cite its authority in the finding's `why` field and in
        docs/research-basis.md. Flag any new rule or threshold change that is
        not accompanied by a calibration run (benchmarks/run_calibration.py)
        and a regression test. Watch for regex patterns vulnerable to
        catastrophic backtracking; tests/test_robustness.py has the bait
        corpus. Severity guidance: blocker means near-zero false positives,
        info must never gate a build.

    - path: "techlint/data/ai_patterns.json"
      instructions: >-
        Each pattern needs a `why` (the evidence) and a `fix` (the
        remediation). Question any pattern that plausibly fires on ordinary
        pre-LLM technical prose — RFC 793 and PEP 8 are the reference points.

    - path: "tests/**"
      instructions: >-
        Every detection rule needs both a positive and a negative test; the
        negative test matters more. Regression tests for fixed bugs belong in
        tests/test_bughunt.py, named after the failure mode, with the
        reproduction documented in the docstring.

    - path: "docs/**"
      instructions: >-
        These files are linted by the tool they document (CI gate 4.0). Quoted
        tic specimens are masked via style.quoted_specimens; prose outside
        quotes must practice what the style guide preaches. Numbers cited in
        docs (calibration scores, separation, test counts) must match
        benchmarks/results/calibration.json and the actual suite.

    - path: ".github/workflows/**"
      instructions: >-
        The release pipeline must stay idempotent: safe to re-run, exits
        quickly when the version is already tagged. Any new gate belongs in
        both ci.yml and release.yml or has a stated reason to be in only one.

    - path: "techlint/textmodel.py"
      instructions: >-
        Position tracking is load-bearing: every downstream finding maps
        offsets through Sentence.positions. Any change to parsing or masking
        needs tests asserting positions stay within the document
        (tests/test_robustness.py invariants).

chat:
  auto_reply: true
