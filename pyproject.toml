[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "techlint"
version = "1.1.1"
description = "Technical-writing linter with AI-tic detection, calibrated against pre-LLM technical prose"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["technical-writing", "linter", "ai-detection", "llm", "style", "documentation"]
authors = [{ name = "volneydouglas" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Documentation",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/volneydouglas/techwriting"
Repository = "https://github.com/volneydouglas/techwriting"
Issues = "https://github.com/volneydouglas/techwriting/issues"
Changelog = "https://github.com/volneydouglas/techwriting/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7"]
yaml = ["PyYAML>=6"]

[project.scripts]
techlint = "techlint.cli:main"

[tool.setuptools]
packages = ["techlint"]

[tool.setuptools.package-data]
techlint = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
